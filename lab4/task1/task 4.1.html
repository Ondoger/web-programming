<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система охолодження процесора</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cooling-card">
        <img src="cooler.jpeg" alt="Cooler Master Hyper 212" class="cooling-img">
        <div class="cooling-info">
            <div class="cooling-title"><strong>Cooler Master Hyper 212</strong></div>
            <div class="cooling-props">
                <div>Тип: <span>повітряна</span></div>
                <div>Розсіювана потужність: <span>150 Вт</span></div>
                <div>Рівень шуму: <span>26 дБ</span></div>
                <div>Матеріал радіатора: <span>Мідь + алюміній</span></div>
            </div>
        </div>
        <div class="cooling-actions">
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">Delete</button>
        </div>
    </div>
</body>
</html>
