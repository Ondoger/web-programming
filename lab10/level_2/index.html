<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування товару (Жорсткий диск)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <button id="openModalBtn" class="btn btn-primary">Відкрити модальне вікно</button>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-window">

            <div class="modal-header">
                <h3 class="modal-title">Редагування: Жорсткий диск</h3>
                <button class="modal-close-btn" id="closeModalBtn">&times;</button>
            </div>

            <div class="modal-body">
                <form id="productForm" class="product-form">

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="modelInput">Виробник / Модель</label>
                            <input class="form-input" type="text" id="modelInput" placeholder="Напр. WD Blue 1TB">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="typeSelect">Тип (внутр./зовн.)</label>
                            <select class="form-select" id="typeSelect">
                                <option value="" disabled selected>Оберіть тип</option>
                                <option value="internal">Внутрішній</option>
                                <option value="external">Зовнішній</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="volumeInput">Обсяг, ГБ</label>
                            <input class="form-input" type="number" id="volumeInput" placeholder="1000">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="interfaceInput">Інтерфейс підключення</label>
                            <input class="form-input" type="text" id="interfaceInput" placeholder="SATA III">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="formFactorInput">Форм-фактор, дюймів</label>
                            <select class="form-select" id="formFactorInput">
                                <option value="" disabled selected>Оберіть розмір</option>
                                <option value="2.5">2.5"</option>
                                <option value="3.5">3.5"</option>
                                <option value="m.2">M.2</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="speedInput">Швидкість шпинделя, об/хв</label>
                            <input class="form-input" type="number" id="speedInput" placeholder="7200">
                        </div>
                    </div>

                    <div class="form-group image-upload-group">
                        <label class="form-label">Зображення товару</label>
                        <div class="image-preview-area">
                            <img id="imagePreview" class="image-thumbnail" src="https://via.placeholder.com/150?text=No+Image" alt="Прев'ю">
                            <div class="file-upload-wrapper">
                                <input class="form-file-input" type="file" id="imageInput" accept="image/*">
                                <label for="imageInput" class="btn btn-secondary btn-sm">Обрати файл</label>
                            </div>
                        </div>
                    </div>

                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">Скасувати</button>
                <button class="btn btn-success" id="saveBtn">Зберегти</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
