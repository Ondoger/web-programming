<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Year Countdown</title>
  <link rel="stylesheet" href="task5.css" />
</head>
<body>
  <div class="countdown-wrapper">
    <h1 class="title">🎆 До Нового Року</h1>
    <div class="countdown">
      <div class="time-block">
        <span class="time-value" id="days">00</span>
        <span class="time-label">Днів</span>
      </div>
      <div class="separator">:</div>
      <div class="time-block">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Годин</span>
      </div>
      <div class="separator">:</div>
      <div class="time-block">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">Хвилин</span>
      </div>
      <div class="separator">:</div>
      <div class="time-block">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Секунд</span>
      </div>
    </div>
    <p class="subtitle" id="message"></p>
  </div>
  <script src="task5.js"></script>
</body>
</html>
