<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Завдання 4 — Реєстрація</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <button id="openModalBtn">Відкрити вікно реєстрації</button>
  </header>

  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="close-btn" id="closeBtn">&times;</button>

      <form id="regForm" novalidate>
        <div class="form-group">
          <label for="nickname">Нікнейм:</label>
          <input type="text" id="nickname" required />
        </div>

        <div class="form-group">
          <label for="email">Електронна адреса:</label>
          <input type="email" id="email" required />
        </div>

        <div class="form-group">
          <label for="password">Пароль:</label>
          <input type="password" id="password" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Підтвердження пароля:</label>
          <input type="password" id="confirmPassword" required />
        </div>

        <button type="submit" class="submit-btn">Зареєструватися</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
