<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Завантаження сторінки</title>
<body>
  <div class="loader">
    <svg class="arrow-spin" viewBox="0 0 100 100">
    
      <path d="M 15 50
               A 35 35 0 1 1 85 50"
            stroke="#73b7fa"
            stroke-width="4"
            fill="none"
            stroke-dasharray="12 6 12 6 12 6 12 6"
            />
      
      <polygon points="82,48 98,44 92,56" fill="#73b7fa"/>
      
      <path d="M 85 50
               A 35 35 0 0 1 15 50"
            stroke="#73b7fa"
            stroke-width="4"
            fill="none"
            opacity="0.15"
            stroke-dasharray="8 6"
            />
    </svg>
  </div>
</body>
</html>
