<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вкладені списки</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <h2>Пори року</h2>
    <ul class="seasons">
        <li class="winter">Зима
            <ul>
                <li>Грудень</li>
                <li>Січень</li>
                <li>Лютий</li>
            </ul>
        </li>
        <li class="spring">Весна
            <ul>
                <li>Березень</li>
                <li>Квітень</li>
                <li>Травень</li>
            </ul>
        </li>
        <li class="summer">Літо
            <ul>
                <li>Червень</li>
                <li>Липень</li>
                <li>Серпень</li>
            </ul>
        </li>
        <li class="autumn">Осінь
            <ul>
                <li>Вересень</li>
                <li>Жовтень</li>
                <li>Листопад</li>
            </ul>
        </li>
    </ul>
</body>
</html>
